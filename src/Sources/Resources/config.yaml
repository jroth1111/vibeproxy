# Server port (CLIProxyAPI runs on 8318, ThinkingProxy forwards from 8317)
port: 8318

# Bind to localhost only for security (prevents exposure on public IPs)
host: 127.0.0.1

# Amp CLI integration (management requests only - login, user, threads)
amp-upstream-url: "https://ampcode.com"
amp-restrict-management-to-localhost: true

# Management API settings
remote-management:
  allow-remote: false
  secret-key: ""  # Leave empty to disable management API

# Authentication directory (stores OAuth tokens)
auth-dir: "~/.cli-proxy-api"

# Logging configuration
debug: false
logging-to-file: false

# Usage statistics
usage-statistics-enabled: true

# Network proxy (if needed for corporate networks)
# Use SOCKS5 for residential proxy access (e.g., dataimpulse for opencode.ai)
# Format: socks5://username:password@host:port
# Note: This applies globally to all providers. For opencode.ai specifically,
# add this to your ~/.cli-proxy-api/config.yaml to enable proxy only when needed.
proxy-url: ""

# Retry configuration
request-retry: 3

# Timeout for upstream provider requests
# Default: 10m. Set to "0" to disable timeout.
# Important for Extended Thinking requests which may take 5-10+ minutes.
request-timeout: "10m"

# Quota management
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# OAuth providers for local subscriptions
# Claude, Codex (GPT), Gemini tokens in ~/.cli-proxy-api/ will be used
# No fallback - users must authenticate providers they want to use

# No API keys needed for OAuth-based providers
generative-language-api-key: []

# OpenAI-compatible providers
# These connect to OpenAI-compatible APIs (OpenAI, Anthropic, custom endpoints)
openai-compatibility:
  # OpenCode.ai - Free Xiaomi MiMo-V2-Pro and MiniMax models
  # No API key required - uses empty bearer token
  # Requires SOCKS5 proxy for connectivity (set proxy-url in user config overlay)
  - name: opencode
    base-url: https://opencode.ai/zen/v1
    proxy-url: ""
    display-name: OpenCode (MiMo)
    help-text: Free Xiaomi MiMo-V2-Pro and MiniMax models. No API key required. Requires proxy.
    icon-system: brain
    models:
      - alias: mimo-v2-pro-opencode
        name: mimo-v2-pro-free
      - alias: minimax-m2.5-opencode
        name: minimax-m2.5-free
